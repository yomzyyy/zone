name: Keep Supabase alive

# Supabase free-tier projects pause after 7 days of inactivity. This workflow
# pings the project's REST API once a day so it never crosses that threshold.
# Runs on GitHub's servers — has nothing to do with the deployed Next.js app.

on:
  schedule:
    # 12:00 UTC every day. Cron syntax: minute hour day-of-month month day-of-week
    - cron: "0 12 * * *"
  # Lets you click "Run workflow" manually in the GitHub Actions tab to test.
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST endpoint
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          # Any authenticated read counts as activity. We hit the columns
          # table with limit=1; RLS may return empty rows for the anon role
          # but the query itself still resets the inactivity timer.
          curl --fail --silent --show-error \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/columns?select=id&limit=1"
          echo "Supabase ping OK."
